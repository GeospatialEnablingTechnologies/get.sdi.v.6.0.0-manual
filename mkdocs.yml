site_name: GET SDI Portal Manual
site_description: GET SDI Portal v6.2.0 Manual

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.ico

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Map:
    - Overview: map/index.md
    - Sidebar: map/sidebar.md
    - Toolbar: map/toolbar.md
    - Attribute Table: map/attribute-table.md
    - Right Click: map/right-click.md
    - Export and Import: map/export-import.md
  - Dashboard:
    - Overview: dashboard/index.md
    - Chart Types: dashboard/chart-types.md
    - Standard Dashboard: dashboard/standard-dashboard.md
    - Map Dashboard: dashboard/map-dashboard.md
  - Files:
    - Overview: files/index.md
    - File Types: files/file-types.md

